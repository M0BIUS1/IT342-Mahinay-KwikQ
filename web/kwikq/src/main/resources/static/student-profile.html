<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - KwikQ</title>
    <link rel="stylesheet" href="/css/modern-style.css">
    <style>
        .profile-container {
            max-width: 900px;
        }
        .edit-mode {
            display: none;
        }
        .view-mode {
            display: block;
        }
        .edit-mode.active {
            display: block;
        }
        .view-mode.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/student-dashboard.html">← Dashboard</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>

    <div class="container">
        <div class="profile-container">
            <!-- Profile Header -->
            <div class="card profile-card">
                <div class="profile-avatar" id="profileAvatar">
                    <span>👤</span>
                </div>
                <div class="profile-info">
                    <h1 id="profileName">Loading...</h1>
                    <p class="text-muted" id="profileEmail">email@example.com</p>
                </div>

                <!-- Profile Stats -->
                <div class="profile-stat">
                    <div class="stat-item">
                        <div class="stat-value" id="activeBorrows">0</div>
                        <div class="stat-label">Active Borrows</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="queueCount">0</div>
                        <div class="stat-label">In Queue</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalFines">$0.00</div>
                        <div class="stat-label">Total Fines</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="borrowLimit">5</div>
                        <div class="stat-label">Borrow Limit</div>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="toggleEditMode()">Edit Profile</button>
            </div>

            <!-- View Mode -->
            <div class="view-mode" id="viewMode">
                <div class="card mt-3">
                    <div class="card-header">
                        <h2>Profile Information</h2>
                    </div>
                    <div class="grid grid-2">
                        <div>
                            <label class="text-muted">Phone Number</label>
                            <p id="displayPhone">Not set</p>
                        </div>
                        <div>
                            <label class="text-muted">Address</label>
                            <p id="displayAddress">Not set</p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="text-muted">Bio</label>
                        <p id="displayBio">No bio provided</p>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h2>Account Status</h2>
                    </div>
                    <div class="grid grid-2">
                        <div>
                            <label class="text-muted">Status</label>
                            <p><span class="badge badge-success" id="accountStatus">Active</span></p>
                        </div>
                        <div>
                            <label class="text-muted">Member Since</label>
                            <p id="memberSince">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Edit Mode -->
            <div class="edit-mode" id="editMode">
                <div class="card mt-3">
                    <div class="card-header">
                        <h2>Edit Profile</h2>
                    </div>
                    <form id="profileForm">
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                        </div>

                        <div class="form-group">
                            <label for="address">Address</label>
                            <input type="text" id="address" name="address" placeholder="Enter your address" required>
                        </div>

                        <div class="form-group">
                            <label for="bio">Bio</label>
                            <textarea id="bio" name="bio" rows="4" placeholder="Tell us about yourself"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="profilePicture">Profile Picture URL</label>
                            <input type="url" id="profilePicture" name="profilePicture" placeholder="https://example.com/avatar.jpg">
                        </div>

                        <div class="flex gap-2">
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                            <button type="button" class="btn btn-secondary" onclick="toggleEditMode()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card mt-3">
                <div class="card-header">
                    <h2>Quick Actions</h2>
                </div>
                <div class="grid grid-2">
                    <button class="btn btn-primary" onclick="goTo('/borrowing-history.html')">📚 Borrowing History</button>
                    <button class="btn btn-primary" onclick="goTo('/queues.html')">⏳ My Queues</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let authToken = localStorage.getItem('jwtToken');

        if (!authToken) {
            window.location.href = '/register.html';
        }

        async function loadProfile() {
            try {
                const response = await fetch(`${API_BASE}/profile`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (response.ok) {
                    const profile = await response.json();
                    displayProfile(profile);
                } else {
                    showError('Failed to load profile');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error loading profile');
            }
        }

        function displayProfile(profile) {
            document.getElementById('profileName').textContent = profile.name;
            document.getElementById('profileEmail').textContent = profile.email;
            document.getElementById('activeBorrows').textContent = profile.activeBorrows;
            document.getElementById('totalFines').textContent = '$' + profile.totalFines.toFixed(2);
            document.getElementById('borrowLimit').textContent = profile.borrowingLimit;

            document.getElementById('displayPhone').textContent = profile.phoneNumber || 'Not set';
            document.getElementById('displayAddress').textContent = profile.address || 'Not set';
            document.getElementById('displayBio').textContent = profile.bio || 'No bio provided';

            // Set form values
            document.getElementById('phone').value = profile.phoneNumber || '';
            document.getElementById('address').value = profile.address || '';
            document.getElementById('bio').value = profile.bio || '';
            document.getElementById('profilePicture').value = profile.profilePictureUrl || '';

            // Set account status
            const statusBadge = document.getElementById('accountStatus');
            if (profile.isBlocked) {
                statusBadge.className = 'badge badge-danger';
                statusBadge.textContent = 'Blocked';
            }

            // Update avatar
            if (profile.profilePictureUrl) {
                document.getElementById('profileAvatar').innerHTML = `<img src="${profile.profilePictureUrl}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            }

            loadBorrowingStats(profile);
        }

        async function loadBorrowingStats(profile) {
            try {
                // Load queue count
                const queueResponse = await fetch(`${API_BASE}/queues/my-queues?page=0&size=1`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                if (queueResponse.ok) {
                    const data = await queueResponse.json();
                    document.getElementById('queueCount').textContent = data.totalElements || 0;
                }
            } catch (error) {
                console.error('Error loading queue count:', error);
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const request = {
                phoneNumber: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                bio: document.getElementById('bio').value,
                profilePictureUrl: document.getElementById('profilePicture').value
            };

            try {
                const response = await fetch(`${API_BASE}/profile`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(request)
                });

                if (response.ok) {
                    const profile = await response.json();
                    displayProfile(profile);
                    toggleEditMode();
                    showSuccess('Profile updated successfully');
                } else {
                    showError('Failed to update profile');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error updating profile');
            }
        });

        function toggleEditMode() {
            document.getElementById('viewMode').classList.toggle('hidden');
            document.getElementById('editMode').classList.toggle('active');
        }

        function goTo(path) {
            window.location.href = path;
        }

        function logout() {
            localStorage.removeItem('jwtToken');
            window.location.href = '/register.html';
        }

        function showSuccess(message) {
            alert('✅ ' + message);
        }

        function showError(message) {
            alert('❌ ' + message);
        }

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
