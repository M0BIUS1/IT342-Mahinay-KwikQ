<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KwikQ — Sign In</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <div class="logo">
                <h1>Kwik<span>Q</span></h1>
                <p>Library Queue Management</p>
            </div>

            <form id="loginForm">
                <h2>Welcome back</h2>
                <p class="subtitle">Sign in to continue to your dashboard</p>

                <div id="errorMsg" class="error-msg" style="display:none;" role="alert" aria-live="assertive"></div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    Sign in
                </button>

                <p class="form-note">Use your registered email and password. Admin, Librarian, and Student accounts are routed to role-specific dashboards.</p>

                <p class="auth-link">
                    New here? <a href="/register.html">Create an account</a>
                </p>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // Redirect if already logged in
        if (getAuth()) {
            redirectToDashboard(getAuth());
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Signing in\u2026';

            try {
                const data = await apiLogin(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
                saveAuth(data);
                redirectToDashboard(data);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
