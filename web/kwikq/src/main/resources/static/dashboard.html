<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KwikQ - Redirecting</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <h2>Redirecting to your dashboard...</h2>
            <p>If you are not redirected, <a href="/index.html">click here</a>.</p>
        </div>
    </div>
    <script src="/js/auth.js"></script>
    <script>
        const auth = getAuth();
        if (!auth) {
            window.location.href = '/index.html';
        } else {
            redirectToDashboard(auth);
        }
    </script>
</body>
</html>
