spring.application.name=kwikq

# Test-only datasource (keeps tests isolated from Supabase)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration for tests
kwikq.jwt.secret=LEZepIxu0orjB9boQgpj7UDmEkVoNqy54lZfxveUIMg=
kwikq.jwt.expiration-ms=86400000

# Supabase properties required by security beans during test startup
supabase.url=https://example.supabase.co
supabase.api-key=test-api-key
supabase.jwt.secret=test-jwt-secret

# Reduce known framework noise in tests for the current security setup.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
