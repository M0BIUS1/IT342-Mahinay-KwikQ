spring.application.name=kwikq

# Prevent automatic browser/page reload behavior during manual testing.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Runtime database
# Default is local H2 for reliable startup; set SUPABASE_* env vars to use Postgres.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:kwikq;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SUPABASE_DB_USERNAME:sa}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Reduce known framework noise in logs for the current security setup.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# JWT Configuration - Local JWT (for backend registration/login)
kwikq.jwt.secret=LEZepIxu0orjB9boQgpj7UDmEkVoNqy54lZfxveUIMg=
kwikq.jwt.expiration-ms=86400000

# Supabase Configuration - For mobile app JWT validation
supabase.url=${SUPABASE_URL:https://neosrhcsogeqsgnatvvb.supabase.co}
supabase.api-key=${SUPABASE_API_KEY:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
